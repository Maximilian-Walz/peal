name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  harnesses:
    name: harnesses (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Every awk the harnesses can find is one they run under; Peal must work with
      # whichever a machine has. macOS brings its own BSD awk and bash 3.2.
      - name: Install the awks
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq mawk gawk original-awk busybox
      - name: Install Claude Code
        if: runner.os == 'Linux'
        run: npm install -g @anthropic-ai/claude-code
      - name: Run every harness
        env:
          PEAL_REQUIRE_CLAUDE: ${{ runner.os == 'Linux' && '1' || '' }}
          # The issues storage's harness runs its fake gh on jq, which both runners have.
          PEAL_REQUIRE_JQ: '1'
        run: tools/test-all.sh

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: shellcheck --version
      - run: tools/lint.sh
