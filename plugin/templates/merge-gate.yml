# Peal's merge gate: fails a pull request in which a task file under backlog/ or doing/
# gains a `merge` key (or a changed one stops parsing), so that `merge: auto`, which the
# human writes only when agreeing a plan, cannot arrive through a pull request that merges
# by itself on its paths (one touching only task files). Copy it to
# .github/workflows/merge-gate.yml, make its job `peal merge-gate` a required check of the
# main branch, and list it in the checks of every auto-merge rule of your control plane
# (Belfry's `auto_merge`). Keep .github/** merged by a human: the gate is only as strong
# as this file and the Peal it pins.
#
# `pull_request`, not `pull_request_target`: the job runs with a read-only token and no
# secrets, so a fork's pull request reaches nothing. The Peal it runs is the pinned one
# below, never the pull request's, and peal merge-gate reads git objects only.
name: Peal merge gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  merge-gate:
    name: peal merge-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Get Peal
        # Pinned to a release's commit; Dependabot does not update it. To move to another
        # release, take its commit from
        #   git ls-remote https://github.com/Maximilian-Walz/peal 'refs/tags/vX.Y.Z^{}'
        # and change both the SHA and the tag in the comment. Peal's own release sets the
        # tag (peal ship bump) and, once the tag exists, the SHA (peal ship pin).
        run: |
          git init -q "$RUNNER_TEMP/peal"
          git -C "$RUNNER_TEMP/peal" fetch -q --depth 1 https://github.com/Maximilian-Walz/peal a837bfc48debe3d812bcce7f45346f3442cbfd90 # v0.7.0
          git -C "$RUNNER_TEMP/peal" checkout -q FETCH_HEAD
      - name: No task file gains a merge key
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: '"$RUNNER_TEMP/peal/plugin/bin/peal" merge-gate "$BASE" HEAD'
