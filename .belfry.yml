# Belfry's contract for this project, written by peal init --stage belfry, then extended
# with the milestone review action, the policy and the docs below.
tasks:
  backend: commands
  commands:
    list: .peal/peal list
    offer: .peal/peal offer "{pool}" --top 10
    pool: current,unassigned
    claim: .peal/peal claim {task} --print-path
    start: /peal:work {task}
    idea: /peal:idea {idea}
    board: .peal/peal board
    milestone: .peal/peal milestone-state {id} {state} --reason {reason}
    retire: .peal/peal retire {task} --reason {reason}
actions:
  milestone-review:
    title: Milestone review
    prompt: /peal:milestone-review {milestone}
    triggers: [milestone]
# Not offered yet: releasing is the human's call.
#   release:
#     title: Release
#     prompt: /peal:release
#     triggers: [button]
#     single: true
#     release: true
policy:
  max_concurrent: 1
  permission_mode: auto
  merge: human
  merge_method: squash
  auto_merge:
    # The human agreed, with the task's plan, that its pull request may merge itself.
    - name: agreed tasks
      task: { merge: auto }
docs:
  - title: Readme
    path: README.md
  - title: Design
    path: docs/design.md
  - title: Milestones
    path: docs/milestones/
